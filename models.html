<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chọn nhân vật 3D — Đặt Bom Pixel</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0a0e1a; color: #eaf7ff;
        font-family: "Courier New", ui-monospace, monospace; overflow: hidden; }
      #scene { position: fixed; inset: 0; }
      #hint { position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
        z-index: 10; padding: 10px 16px; border: 1px solid rgba(53,217,255,0.4);
        background: rgba(6,14,26,0.85); font-size: 14px; text-align: center; max-width: 92vw; }
      #hint b { color: #f9d66b; }
      .label { padding: 3px 8px; border: 1px solid rgba(53,217,255,0.5);
        background: rgba(6,14,26,0.9); color: #eaf7ff; font-size: 13px; font-weight: 700;
        white-space: nowrap; transform: translateY(14px); }
      .label small { color: #9db1c9; font-weight: 400; }
    </style>
  </head>
  <body>
    <div id="hint">
      Kéo chuột để xoay · cuộn để zoom. Mỗi nhân vật có <b>số thứ tự</b> —
      nhắn tôi <b>số bạn thích</b> để đưa vào game. Tất cả đều <b>CC0 (miễn phí)</b>.
    </div>
    <div id="scene"></div>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
